<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游泳打卡记录</title>
  <style>
    :root {
      --bg: #f2f6fa;
      --card: #ffffff;
      --text: #222;
      --text2: #666;
      --border: #eee;
      --nicole: #2584ff;
      --ice: #ff69b4;
      --btn-green: #28a745;
      --btn-yellow: #ffc107;
      --btn-red: #dc3545;
      --btn-primary: #2584ff;
    }

    .dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #eee;
      --text2: #aaa;
      --border: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 140px;
      transition: 0.2s
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px #00000018
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      margin: 6px 0;
      cursor: pointer;
      color: #fff
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 14px
    }

    .btn-round {
      border-radius: 999px
    }

    .btn-primary {
      background: var(--btn-primary)
    }

    .btn-warning {
      background: var(--btn-yellow);
      color: #222
    }

    .btn-danger {
      background: var(--btn-red)
    }

    .btn-green {
      background: var(--btn-green)
    }

    .btn-toggle {
      background: #6c757d
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed
    }

    .row-flex {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .info-line {
      padding: 6px 0;
      font-size: 15px
    }

    .section-title {
      font-size: 17px;
      font-weight: 600;
      margin: 12px 0 8px
    }

    .calendar-wrap {
      overflow-x: auto
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .cal-day {
      aspect-ratio: 1/1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border: 1px solid var(--border);
      position: relative
    }

    .cal-day.clickable {
      cursor: pointer
    }

    .cal-day.nicole {
      background: #2584ff33;
      border-color: var(--nicole)
    }

    .cal-day.ice {
      background: #ff69b433;
      border-color: var(--ice)
    }

    .cal-day.both {
      background: linear-gradient(135deg, #2584ff33 0%, #2584ff33 49%, #ff69b433 50%, #ff69b433 100%);
      border-color: #888
    }

    .cal-day.disabled {
      opacity: 0.25;
      cursor: not-allowed
    }

    .cal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px
    }

    .cal-header>div {
      text-align: center;
      font-size: 13px;
      color: var(--text2)
    }

    .cal-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px
    }

    .cal-nav button {
      padding: 4px 8px
    }

    .user-popup {
      position: fixed;
      inset: 0;
      background: #00000050;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99
    }

    .user-popup-inner {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      width: 240px
    }

    .user-popup-item {
      padding: 12px 0;
      text-align: center;
      font-size: 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer
    }

    .user-popup-item:last-child {
      border-bottom: none
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 8px 0
    }

    .stat-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center
    }

    .stat-item>div:first-child {
      font-size: 14px;
      color: var(--text2)
    }

    .stat-item>div:last-child {
      font-size: 18px;
      font-weight: 600;
      margin-top: 4px
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 16px 0
    }

    .big-main {
      width: 160px;
      height: 160px;
      font-size: 20px
    }

    .small-side {
      width: 100px;
      height: 100px;
      font-size: 14px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      margin: 8px 0;
      font-size: 16px
    }
  </style>
</head>

<body>
  <style>
    :root {
      color-scheme: light
    }

    .dark {
      color-scheme: dark
    }

    body {
      max-width: 680px;
      margin: auto;
      padding: 16px 16px 48px
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      touch-action: manipulation;
      min-height: 44px
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #2584ff;
      outline-offset: 3px
    }

    .row-between {
      gap: 12px;
      flex-wrap: wrap
    }

    .btn {
      font-size: 15px
    }

    .btn-sm {
      min-height: 44px
    }

    .subtle {
      color: var(--text2);
      font-size: 13px;
      line-height: 1.7
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 12px 0
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #a07400;
      flex-shrink: 0
    }

    .status-dot.ok {
      background: #218540
    }

    .status-main {
      flex: 1;
      min-width: 0
    }

    .plain {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px
    }

    .user-button {
      font-weight: 700;
      font-size: 19px
    }

    .cal-day {
      background: var(--card);
      color: var(--text);
      padding: 0;
      min-width: 0;
      min-height: 36px;
      width: 100%
    }

    .cal-day.disabled {
      opacity: .4
    }

    .cal-day.today {
      box-shadow: inset 0 0 0 2px var(--text)
    }

    .cal-nav {
      justify-content: space-between;
      gap: 8px
    }

    .cal-nav button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px
    }

    .big-main {
      width: 145px;
      height: 145px
    }

    .small-side {
      width: 95px;
      height: 95px
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px
    }

    .notice {
      padding: 12px;
      border: 1px solid #b68516;
      border-radius: 12px;
      background: #ffc10712;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.7
    }

    .suspend-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .suspend-row:last-child {
      border-bottom: 0
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: #0009;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto
    }

    .modal-panel {
      background: var(--card);
      color: var(--text);
      width: 100%;
      max-width: 490px;
      max-height: 90dvh;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 16px 70px #0005
    }

    .modal-panel h2 {
      font-size: 20px;
      margin: 0 0 14px
    }

    .modal-panel p {
      line-height: 1.7;
      margin: 8px 0
    }

    .modal-panel label {
      display: block;
      font-size: 14px;
      margin-top: 12px
    }

    .modal-panel input,
    .modal-panel textarea,
    .modal-panel select {
      margin: 6px 0
    }

    .modal-panel select {
      width: 100%;
      padding: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px
    }

    .modal-panel textarea {
      width: 100%;
      padding: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 120px;
      font-family: ui-monospace, monospace;
      font-size: 13px
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 18px
    }

    .check-label {
      display: flex !important;
      gap: 10px;
      align-items: center
    }

    .check-label input {
      width: 20px;
      height: 20px;
      flex-shrink: 0
    }

    .form-error {
      color: #d93036;
      font-size: 14px;
      line-height: 1.7;
      margin-top: 8px
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--card);
      padding: 12px 18px;
      border-radius: 12px;
      z-index: 2000;
      max-width: 90vw;
      box-shadow: 0 4px 20px #0004;
      text-align: center;
      font-size: 14px
    }

    .stack-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .stat-item>div:last-child {
      font-size: 20px
    }

    .info-line {
      overflow-wrap: anywhere
    }

    input[type=file] {
      padding: 8px
    }

    .app-heading {
      font-size: 24px;
      margin: 8px 0 4px;
      letter-spacing: -.5px
    }

    [hidden] {
      display: none !important
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin: 8px 0 18px
    }

    .top-bar .app-heading {
      font-size: 23px;
      line-height: 1.3;
      margin: 6px 0 0;
      flex: 0 0 auto;
      min-width: 0;
      white-space: nowrap
    }

    .top-tools {
      flex: 0 1 220px;
      min-width: 0
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px
    }

    .top-actions .plain {
      font-size: 12px;
      padding: 7px 10px;
      white-space: nowrap
    }

    .top-status {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 6px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text2);
      line-height: 1.5;
      text-align: right;
      overflow-wrap: anywhere
    }

    .top-status .status-dot {
      width: 6px;
      height: 6px;
      margin-top: 5px
    }

    .footer-actions {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px
    }

    .footer-actions .btn {
      font-size: 13px;
      flex: 1;
      padding: 10px 6px;
      white-space: nowrap
    }

    .first-help {
      display: block;
      margin: 0 auto 14px;
      font-size: 13px
    }

    @media(max-width:380px) {
      .top-bar {
        gap: 8px
      }

      .top-bar .app-heading {
        font-size: 19px
      }

      .top-tools {
        flex-basis: 175px
      }

      .top-actions .plain {
        padding: 6px 8px;
        font-size: 11px
      }

      body {
        padding: 12px
      }

      .card {
        padding: 14px
      }

      .stat-grid {
        gap: 6px
      }

      .stat-item {
        padding: 8px
      }

      .cal-day {
        min-height: 32px;
        font-size: 13px
      }

      .big-main {
        width: 130px;
        height: 130px
      }

      .modal-panel {
        padding: 18px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    /* 所有弹窗操作按钮采用相同间距和边框宽度，高度随内容自然确定。 */
    .modal-actions>button {
      min-height: 0;
      margin: 6px 0;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 20px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-actions>button.plain {
      border-color: var(--border);
    }

    /* 成员选择：只显示两行按钮。 */
    .modal-actions.user-choice-actions {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      margin-top: 0;
    }

    .modal-actions.user-choice-actions>button {
      width: 100%;
      margin: 0;
    }
  </style>
  <div id="app" aria-busy="true">
    <div class="card">
      <h1 class="app-heading">游泳打卡记录</h1>
      <p class="subtle">正在读取本机记录…</p>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="toast" class="toast" role="status" hidden></div>

      let db = null, state = { cloud: [], pending: [], prefs: { user: 'A', theme: 'auto' }, config: { owner: '', repo: '', branch: 'main' }, savedToken: '', device: '' };
      let token = '', ready = false, syncing = false, lastSync = '', syncMessage = '', statusKind = '', durable = false, persistQueue = Promise.resolve(), editQueue = Promise.resolve();
      let viewMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1), modal = null, returnFocus = null, syncTimer = null, retryTimer = null, toastTimer = null;

      function day(s) { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) throw new Error('日期格式无效'); const [y, m, d] = s.split('-').map(Number); if (y < 1900 || y > 2200) throw new Error('日期年份须在 1900—2200 之间'); const dt = new Date(y, m - 1, d, 12); if (dateText(dt) !== s) throw new Error('日期无效'); return dt; }

      function toast(s) { const el = document.getElementById('toast'); el.textContent = s; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 4200); }

  <script type="text/plain" id="previous-version">
// ========== 配置 ==========
const USER_A = "Nicole"
const USER_B = "冰淇淋"
const STORAGE_KEY = 'swim_card_double_data'
const MAX_SUSPEND_DAYS = 183
const MAX_SUSPEND_PER_YEAR = 4

function emptyData(){
  return {
    startDate: null,
    totalFee: null,
    users:{
      A:{ checkins:[] },
      B:{ checkins:[] }
    },
    suspendRecords: [],
    darkMode: null,
    currentUser:'A',
    lastAutoBackupMonth: null
  }
}
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || emptyData()
let calYM = new Date()
let showUserSelect = false

const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
function getEffectiveDark(){
  if(data.darkMode === null) return mediaQuery.matches
  return data.darkMode
}
mediaQuery.addEventListener('change', ()=>render())

function parseDay(s){ return new Date(s) }
function fmtDay(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0')
  return `${y}-${m}-${dy}`
}
function fmtDot(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0')
  return `${y}.${m}.${dy}`
}
function fmtLocal(d){ return d.toLocaleString('zh-CN') }
function addMonth(d, n){
  const nd=new Date(d); nd.setMonth(nd.getMonth()+n); return nd
}
function diffDay(a,b){
  return Math.round((a.getTime()-b.getTime())/86400000)
}

function baseExpire(){
  return addMonth(parseDay(data.startDate), 3*12+2)
}
function totalSuspendDays(){
  return data.suspendRecords.reduce((sum,it)=>sum+it.days,0)
}
function effectiveExpire(){
  return new Date(baseExpire().getTime() + totalSuspendDays()*86400000)
}

function getCardYear(startDay, targetDay){
  const s=new Date(startDay); let y=1
  while(true){
    const yearEnd = addMonth(s, y*12)
    if(targetDay < yearEnd) return y
    y++
  }
}
function countSuspendByYear(){
  const map={}
  data.suspendRecords.forEach(s=>{ map[s.yearNo]=(map[s.yearNo]||0)+1 })
  return map
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)) }

function getNowYM(){
  const now=new Date()
  return `${now.getFullYear()}-${now.getMonth()}`
}

function doCheckin(who, dt=new Date()){
  if(!data.startDate) return alert("请先设置开卡信息")
  const exp = effectiveExpire()
  const startD = parseDay(data.startDate)
  if(dt > exp) return alert("该日期已超过卡片有效期，不能打卡")
  if(dt < startD) return alert("不能早于开卡日期打卡")
  const ds = fmtDay(dt)
  const arr = data.users[who].checkins
  const has = arr.some(x=>fmtDay(new Date(x.ts))===ds)
  if(!has) arr.push({ts:dt.getTime(),dateStr:fmtLocal(dt)})
  save();

  const thisYM = getNowYM()
  if(data.lastAutoBackupMonth !== thisYM){
    data.lastAutoBackupMonth = thisYM
    save()
    setTimeout(()=>{
      if(confirm("本月首次打卡，是否更新备份？")) exportJsonIosShare()
    },300)
  }
  render()
}
function checkinToday(who){ doCheckin(who, new Date()) }
function doubleCheckin(){ checkinToday('A'); checkinToday('B') }
// 修复：全局挂载函数，保证onclick可以正常调用
window.toggleCheckinOnDay = function(who, dayStr){
  const d = parseDay(dayStr)
  const startD = parseDay(data.startDate)
  const expD = effectiveExpire()
  const now = new Date()
  if(d > now || d < startD || d > expD) return alert("仅可操作：开卡日 ~ 今天")
  const arr = data.users[who].checkins
  const idx = arr.findIndex(x=>fmtDay(new Date(x.ts))===dayStr)
  if(idx>=0){
    if(!confirm(`确认删除【${who==='A'?USER_A:USER_B}】${dayStr}打卡？`)) return
    arr.splice(idx,1)
  }else{
    if(!confirm(`补卡【${who==='A'?USER_A:USER_B}】${dayStr}`)) return
    doCheckin(who, d)
  }
  save(); render()
}

function getUserStats(who){
  const list = data.users[who].checkins.map(x=>new Date(x.ts))
  const total = list.length
  const now = new Date()
  const m = now.getMonth(), y = now.getFullYear()
  const monthCnt = list.filter(d=>d.getFullYear()===y && d.getMonth()===m).length
  let avgFee = null
  if(total>0 && data.totalFee>0) avgFee = (data.totalFee / total).toFixed(0)
  return {total, monthCnt, avgFee}
}

function renderCalendar(){
  const y = calYM.getFullYear(), m = calYM.getMonth()
  const first = new Date(y,m,1)
  const last = new Date(y,m+1,0)
  const startGap = first.getDay()
  const days = []
  for(let i=0;i<startGap;i++) days.push(null)
  for(let d=1;d<=last.getDate();d++) days.push(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`)
  const Aset = new Set(data.users.A.checkins.map(x=>fmtDay(new Date(x.ts))))
  const Bset = new Set(data.users.B.checkins.map(x=>fmtDay(new Date(x.ts))))
  const startD = parseDay(data.startDate)
  const expD = effectiveExpire()
  const now = new Date()
  let html = `
    <div class="cal-nav">
      <div><button onclick="calYM.setFullYear(calYM.getFullYear()-1);render()">←</button> ${y}年 <button onclick="calYM.setFullYear(calYM.getFullYear()+1);render()">→</button></div>
      <div><button onclick="calYM.setMonth(calYM.getMonth()-1);render()">←</button> ${m+1}月 <button onclick="calYM.setMonth(calYM.getMonth()+1);render()">→</button></div>
    </div>
    <div class="cal-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="calendar">
  `
  days.forEach(ds=>{
    if(!ds){ html += `<div class="cal-day"></div>`; return }
    let cls = 'cal-day'
    const dayDate = parseDay(ds)
    const canOperate = dayDate >= startD && dayDate <= now && dayDate <= expD
    if(!canOperate) cls += ' disabled'
    else cls += ' clickable'
    const hasA = Aset.has(ds), hasB = Bset.has(ds)
    if(hasA && hasB) cls += ' both'
    else if(hasA) cls += ' nicole'
    else if(hasB) cls += ' ice'
    const u = data.currentUser
    html += `<div class="${cls}" ${canOperate ? `onclick="toggleCheckinOnDay('${u}','${ds}')"` : ''}>${+ds.slice(-2)}</div>`
  })
  html += '</div>'
  return html
}

function addSuspend(susStart, susEnd){
  const s=parseDay(susStart),e=parseDay(susEnd)
  if(e<=s) return alert('结束日期必须大于开始日期！')
  const days = diffDay(e,s)
  const remainSuspendQuota = MAX_SUSPEND_DAYS - totalSuspendDays()
  if(days > remainSuspendQuota) return alert(`超出剩余停卡额度！剩余可停：${remainSuspendQuota}天`)
  const yearNo = getCardYear(parseDay(data.startDate), s)
  const yc = countSuspendByYear()[yearNo]||0
  if(yc >= MAX_SUSPEND_PER_YEAR) return alert(`第${yearNo}卡周期已达4次停卡上限`)
  data.suspendRecords.push({start:susStart,end:susEnd,days,yearNo})
  save();render()
}
function delSuspend(idx){
  if(!confirm("确定删除这条停卡？到期日自动回退！")) return
  data.suspendRecords.splice(idx,1)
  save();render()
}

function setStart(dateStr, fee){
  data.startDate = dateStr
  data.totalFee = Number(fee||0)
  save();render()
}
window.switchUserTo = function(u){
  data.currentUser = u
  showUserSelect = false
  save();render()
}
function toggleDark(){
  if(data.darkMode === null) data.darkMode = true
  else if(data.darkMode === true) data.darkMode = false
  else data.darkMode = null
  save();render()
}
function resetAll(){
  if(!confirm('⚠️全部数据清空，不可恢复！'))return
  data=emptyData();save();render()
}

// iOS 分享接口导出
function exportJsonIosShare(){
  const txt = JSON.stringify(data, null, 2)
  const blob = new Blob([txt], {type:"application/json"})
  const file = new File([blob], "swim_data.json", {type:"application/json"})
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({
      files:[file],
      title:"游泳打卡记录备份",
      text:"swim_data.json"
    }).catch(e=>{
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = "swim_data.json"
      a.click()
      URL.revokeObjectURL(url)
    })
  }else{
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = "swim_data.json"
    a.click()
    URL.revokeObjectURL(url)
  }
}
function importJson(){
  const raw = prompt("粘贴完整JSON备份文本：")
  if(!raw) return
  try{
    const parsed = JSON.parse(raw)
    if(!parsed || !parsed.users) throw new Error("格式错误")
    if(!confirm("确认导入？覆盖当前所有数据！")) return
    data = parsed
    save()
    alert("导入成功！")
    render()
  }catch(e){
    alert("JSON解析失败："+e.message)
  }
}

function render(){

  document.documentElement.classList.toggle('dark', isDark)
  const app=document.getElementById('app')
  if(!data.startDate){
    app.innerHTML=`
    <div class="card">
      <div class="section-title">录入开卡信息</div>

    </div>

  const startD = parseDay(data.startDate)

  const effExp = effectiveExpire()

  let remainDays = diffDay(effExp, now)
  if(remainDays < 0) remainDays = 0
  const suspendTotal = totalSuspendDays()
  const statA = getUserStats('A'), statB=getUserStats('B')
  const cu = data.currentUser
  const cuName = cu==='A'?USER_A:USER_B
  const currStat = getUserStats(cu)

  let popupHtml = ''
  if(showUserSelect){
    popupHtml = `
    <div class="user-popup" onclick="showUserSelect=false;render()">
      <div class="user-popup-inner" onclick="event.stopPropagation()">
        <div class="user-popup-item" onclick="switchUserTo('A')">${USER_A}</div>
        <div class="user-popup-item" onclick="switchUserTo('B')">${USER_B}</div>
      </div>
    </div>
    `
  }

  app.innerHTML=`
  ${popupHtml}
  <div class="card row-between">
    <div style="font-size:18px;font-weight:600;cursor:pointer" onclick="showUserSelect=true;render()">${cuName} 🔁</div>
    <button class="btn btn-sm btn-toggle" onclick="toggleDark()">深色：${data.darkMode===null?'跟随':data.darkMode?'开':'关'}</button>
  </div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat-item">
        <div>打卡</div>
        <div>${currStat.total}次</div>
      </div>
      <div class="stat-item">
        <div>本月</div>
        <div>${currStat.monthCnt}次</div>
      </div>
      <div class="stat-item">
        <div>折算</div>
        <div>${currStat.avgFee?currStat.avgFee+'元/次':'-'}</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-primary btn-round big-main" onclick="checkinToday('${cu}')" ${isExpired?'disabled':''}>🏊 打卡</button>
    <button class="btn btn-warning btn-round small-side" onclick="doubleCheckin()" ${isExpired?'disabled':''}>👥双人</button>
  </div>
  ${isExpired?'<div style="text-align:center;color:red">卡片已过期，禁止打卡</div>':''}

  <div class="card calendar-wrap">
    <div class="section-title">日历（点击日期补/删打卡）</div>
    ${renderCalendar()}
  </div>

  <div class="card row-between">
    <div class="section-title" style="margin:0">新增停卡</div>
    <button class="btn btn-sm btn-warning" onclick="addSuspend(document.getElementById('susStart').value,document.getElementById('susEnd').value)">提交</button>
  </div>
  <div class="card" style="margin-top:-10px">
    <input type="date" id="susStart">
    <input type="date" id="susEnd">
  </div>

  <div class="card">
    <div class="info-line">${USER_A} / ${statA.total}次 🆚 ${USER_B} / ${statB.total}次</div>
    <div class="info-line">已开卡/剩余日：${passedDays}天/${remainDays}天</div>
    <div class="info-line">有效期: ${fmtDot(startD)} - ${fmtDot(effExp)}</div>
    <div class="info-line">停卡：${suspendTotal}/${MAX_SUSPEND_DAYS}天</div>
    <div class="info-line">停卡记录：${data.suspendRecords.length>0 ? data.suspendRecords.map(x=>`${x.start}~${x.end}(${x.days}天)`).join('；') : '无'}</div>
    <div class="info-line">总卡费：${data.totalFee}元*2</div>
  </div>

  <div class="card row-flex" style="justify-content:space-around">
    <button class="btn btn-sm btn-warning" onclick="importJson()">📥导入JSON</button>
    <button class="btn btn-sm btn-danger" onclick="resetAll()">重置数据</button>
    <button class="btn btn-sm btn-green" onclick="exportJsonIosShare()">📤导出记录</button>
  </div>
  `
}
render()
</script>
</body>

</html>
